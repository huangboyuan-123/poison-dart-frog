# 箭毒蛙 Poison Dart Frog — 完整部署
# 启动: docker compose up -d
# 停止: docker compose down
# 日志: docker compose logs -f api

services:
  # ── FastAPI 后端 ─────────────────────────
  api:
    build: .
    container_name: frog-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - frog-net

  # ── MySQL 8.0 ────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: frog-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - frog-net

  # ── Redis 7 ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: frog-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - frog-net

volumes:
  mysql_data:
  redis_data:

networks:
  frog-net:
    driver: bridge
