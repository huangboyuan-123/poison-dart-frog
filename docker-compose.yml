# 箭毒蛙 Poison Dart Frog — Docker 一键部署
# Windows: docker compose up -d
# Linux:   docker compose up -d  (X11自动转发)
# Mac:     docker compose up -d

services:
  frog:
    build: .
    container_name: frog-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MYSQL_HOST=mysql
      - REDIS_HOST=redis
      - DISPLAY=${DISPLAY:-:0}
    volumes:
      # Linux X11 socket (GUI显示)
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      # Windows WSLg socket
      - /mnt/wslg/.X11-unix:/tmp/.X11-unix:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - frog-net

  mysql:
    image: mysql:8.0
    container_name: frog-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - frog-net

  redis:
    image: redis:7-alpine
    container_name: frog-redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - frog-net

volumes:
  mysql_data:
  redis_data:

networks:
  frog-net:
    driver: bridge
