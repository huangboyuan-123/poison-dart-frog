[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlagent"
version = "0.2.0"
description = "AI-powered SQL Agent API — FastAPI + LangChain + MySQL 数据库智能操控系统"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "会飞的程序源", email = "1624058291@qq.com"},
]
keywords = ["sql", "ai", "agent", "langchain", "llm", "mysql", "fastapi", "nl2sql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "langchain>=0.3,<0.4",
    "langchain-openai>=0.2,<0.3",
    "sqlalchemy>=2.0,<3.0",
    "pydantic>=2.10,<2.11",
    "python-dotenv>=1.0,<2.0",
    "pymysql>=1.1,<2.0",
    "sqlparse>=0.5,<1.0",
    "rich>=13.0,<14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<6.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.0,<2.0",
]

[project.urls]
Homepage = "https://gitee.com/huang-baiyuan123/sqlagent"
Repository = "https://gitee.com/huang-baiyuan123/sqlagent.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
